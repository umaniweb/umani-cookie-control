name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Creer le zip
        run: |
          mkdir -p umani-cookie-control
          rsync -a --exclude='/.git' --exclude='/.github' --exclude='/umani-cookie-control/' . umani-cookie-control/
          zip -qr umani-cookie-control.zip umani-cookie-control/

      - name: Attacher au release
        uses: softprops/action-gh-release@v2
        with:
          files: umani-cookie-control.zip
